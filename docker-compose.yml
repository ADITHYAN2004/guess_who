# Redis for Guess Who (optional). Port 6380 on your machine so it doesn't clash
# with any other Redis already using 6379.
#   docker compose up -d redis      then      npm run start:redis
services:
  redis:
    image: redis:7-alpine
    container_name: guesswho-redis
    command: ["redis-server", "--appendonly", "yes"]   # also save to disk, so Redis restarts keep games
    ports:
      - "6380:6379"
    volumes:
      - guesswho-redis-data:/data
    restart: unless-stopped

volumes:
  guesswho-redis-data:
